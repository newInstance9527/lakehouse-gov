# LiteLLM 模型清单模板（D1）
# 密钥一律来自环境变量；禁止把明文 Key 写进本文件并提交 Git。
# 门户登记 SoT = gov_ai_model + Vault(secret/lakehouse/ai/{modelId})；
# D3：门户创建/更新/启停会尝试管理 API 同步别名 lh/{id}（需 store_model_in_db）；
# 无 DB / 网关未起时同步软跳过，仍可用本文件静态种子。

model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

  # 可选：DeepSeek / 通义 / 本地 OpenAI 兼容
  # - model_name: deepseek-chat
  #   litellm_params:
  #     model: deepseek/deepseek-chat
  #     api_key: os.environ/DEEPSEEK_API_KEY
  # - model_name: qwen-plus
  #   litellm_params:
  #     model: dashscope/qwen-plus
  #     api_key: os.environ/DASHSCOPE_API_KEY
  # - model_name: local-qwen
  #   litellm_params:
  #     model: openai/qwen2.5
  #     api_base: http://vllm:8000/v1
  #     api_key: os.environ/LOCAL_LLM_API_KEY

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
