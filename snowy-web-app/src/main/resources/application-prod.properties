#########################################
# prod 环境：仅 ENV 占位，禁止写真值进仓库
# 启动：-Dspring.profiles.active=prod
# 生产优先 Vault；下列 ENV 仅作 bootstrap / 无 Vault 时注入
#########################################

spring.datasource.dynamic.datasource.master.password=${LH_DB_PASSWORD:}
spring.data.redis.password=${LH_REDIS_PASSWORD:}
spring.datasource.druid.stat-view-servlet.login-password=${LH_DRUID_PASSWORD:}
knife4j.basic.password=${LH_KNIFE4J_PASSWORD:}

lh.vault.backend=${LH_VAULT_BACKEND:aes}
lh.vault.aes-key=${LH_VAULT_AES_KEY:}
lh.vault.addr=${LH_VAULT_ADDR:}
lh.vault.token=${LH_VAULT_TOKEN:}
lh.vault.kv-mount=${LH_VAULT_KV_MOUNT:secret}

lh.trino.insecure-ssl=${LH_TRINO_INSECURE_SSL:false}
lh.http.insecure-ssl=${LH_HTTP_INSECURE_SSL:false}

lh.trino.password=${LH_TRINO_PASSWORD:}
lh.ds.password=${LH_DS_PASSWORD:}
lh.flink.password=${LH_FLINK_PASSWORD:}
lh.clickhouse.password=${LH_CLICKHOUSE_PASSWORD:}
lh.sqlrest.password=${LH_SQLREST_PASSWORD:}
lh.apisix.api-key=${LH_APISIX_API_KEY:}
lh.openmetadata.password=${LH_OPENMETADATA_PASSWORD:}
lh.marquez.password=${LH_MARQUEZ_PASSWORD:}
lh.gravitino.password=${LH_GRAVITINO_PASSWORD:}
lh.superset.password=${LH_SUPERSET_PASSWORD:}
lh.minio.access-key=${LH_MINIO_ACCESS_KEY:}
lh.minio.secret-key=${LH_MINIO_SECRET_KEY:}
lh.compute.gitea.token=${LH_GITEA_TOKEN:}
lh.ai.litellm-master-key=${LH_LITELLM_MASTER_KEY:}
lh.compliance.subject-hmac-key=${LH_COMPLIANCE_HMAC_KEY:}

# 闸门收紧（波次 G）：prod 默认更硬
lh.etl.contract-require-registered=${LH_ETL_CONTRACT_REQUIRE:true}
lh.etl.hard-fail-ds-on-deploy=${LH_ETL_HARD_FAIL_DS:true}
lh.catalog.projection-hard-fail=${LH_CATALOG_PROJECTION_HARD_FAIL:true}
# 波次 N2：prod 默认要求契约登记；local 见 application.properties=false
lh.lifecycle.allow-degraded=${LH_LIFECYCLE_ALLOW_DEGRADED:false}
lh.metric.allow-degraded-materialize=${LH_METRIC_ALLOW_DEGRADED:false}
