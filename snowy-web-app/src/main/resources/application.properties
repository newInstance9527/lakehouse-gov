lh.ds.url=http://127.0.0.1:12345/dolphinscheduler
lh.ds.vault-path=platform/dolphinscheduler/api
lh.ds.user=admin
lh.ds.password=
lh.ds.project-code=184736894224512
lh.ds.worker-group=default
lh.ds.tenant-code=root
