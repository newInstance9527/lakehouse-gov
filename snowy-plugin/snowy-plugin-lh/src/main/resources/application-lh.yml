# 湖仓外部组件默认值（application.properties 的 lh.* 优先生效）
# 凭证：运行时从 vault-path → ig_secret_store 读取；yml 明文仅作首次 bootstrap 种子
lh:
  vault:
    aes-key: ""
  trino:
    url: https://127.0.0.1:18080
    # Web UI 根（Explain / 慢查询外链；缺省回退为 url）
    ui-url: https://127.0.0.1:18080
    vault-path: platform/trino/query
    user: admin
    password: ""
    insecure-ssl: true
    # 即席查询面：白名单 ∩ SHOW CATALOGS；湖表 iceberg + 联邦 clickhouse（须 Trino 已挂载）
    query-catalogs: iceberg,clickhouse
    lake-catalogs: iceberg
    catalog-cache-ttl-ms: 300000
    show-unrunnable-in-tree: false
    # 主体 bind/sync 时下发 impersonation；空=仅 GET 导出。与 Trino 同机或共享卷时填 rules.json 路径
    # impersonation-rules-path: /etc/trino/access-control/rules.json
  ds:
    url: http://127.0.0.1:12345/dolphinscheduler
    vault-path: platform/dolphinscheduler/api
    user: admin
    password: ""
    # 门户专用 DS 项目 lakehouse-gov（与「入库项目」等业务项目隔离）
    project-code: "184736894224512"
    worker-group: default
    # admin 用户绑定租户 root；勿用 default（admin 选 default 会报「未指定当前登录用户的租户」）
    tenant-code: root
    # token:  # 本环境勿配；必须 user/password → /login 取 sessionId（切勿带 token 请求头，会 401）
  flink:
    # UI / 门户：经dev3 ui-auth 反代到dev2 JM
    url: http://127.0.0.1:8081
    # DS Worker → JM REST（内网）
    rest-address: 10.0.0.181
    rest-port: 8081
    vault-path: platform/flink/ui
    user: admin
    password: ""
    # DS Worker 内须能执行 sql-client.sh（见 deploy/ds-worker-flink-home.sh）
    home: /opt/flink
    # sql-gateway-url:  # 可选
  spark:
    # Worker 无 YARN client 时用 local[*]；切 YARN 改 yarn 并配 HADOOP_CONF_DIR 后重新发布
    master: local[*]
    home: /opt/spark
    jars: /opt/spark/jars/mysql-connector-j-8.0.33.jar
  datax:
    home: /opt/lh-datax
  clickhouse:
    url: http://127.0.0.1:8123
    vault-path: platform/clickhouse/default
    user: default
    password: ""
    # 非空则合规 ALTER DELETE 带 ON CLUSTER，校验走 clusterAllReplicas
    cluster: ""
  sqlrest:
    manager-url: http://127.0.0.1:18090
    username: admin
    password: ""
    default-group-id: 1
    default-module-id: 1
    # 正式 MUST 为 Trino JDBC；当前环境未登记 Trino 时可临时用已有 DS
    datasource-id: 1
    # 数据 API 边缘：仅 gateway（SQLREST Gateway）。apisix/both 已废弃，代码强制回落
    edge-mode: gateway
    gateway-url: http://127.0.0.1:18091
    executor-upstream: "127.0.0.1:18091"
  dataapi:
    # true=发布必须携带已审批 API-xxx；联调可先 false
    require-publish-ticket: false
    gateway-probe-timeout-ms: 8000
  # APISIX：数据服务明确不做；保留配置块以免旧环境报错，发布路径不再调用
  apisix:
    admin-url: http://127.0.0.1:9180
    vault-path: platform/apisix/admin
    api-key: 
    key-auth-enabled: false
  openmetadata:
    url: http://127.0.0.1:8585
    vault-path: platform/openmetadata/bot
    email: admin@open-metadata.org
    password: ""
    # token:  # 可选 Bot PAT；空则运行时用 email/password 登录取 JWT
    lake-service: lakehouse
    lake-database: default
  marquez:
    url: http://127.0.0.1:15000
    vault-path: platform/marquez/api
    user: admin
    password: ""
  gravitino:
    url: http://127.0.0.1:8090
    vault-path: platform/gravitino/api
    user: admin
    password: ""
    metalake: lakehouse
    catalog: iceberg
  schema-sync:
    enabled: true
    schemas: ""
  superset:
    url: http://127.0.0.1:8088
    vault-path: platform/superset/api
    user: admin
    password: ""
  minio:
    url: http://127.0.0.1:9009
    vault-path: platform/minio/s3
    bucket: lh-portal
    dataset-prefix: adhoc/dataset
    region: us-east-1
    # access-key / secret-key 建议只写 Vault，此处可留空
  etl:
    default-engine: flink
    local-trial-fallback: true
  catalog:
    # false=注册资产时 objectName 必须已在 ig_ds_table；true=允许手工对象名
    allow-manual-object-name: false
  lifecycle:
    spark-catalog: iceberg
    # 空=跳过 VM；配好后日批直写 /api/v1/import/prometheus（禁 Pushgateway）
    vm-import-url: ""
    vm-import-timeout-ms: 15000
    # days-to-full 软容量（字节）；0=跳过派生。优先 VM/桶覆盖，本项兜底
    forecast-default-capacity-bytes: 21990232555520
    forecast-reclaim-confidence: 0.7
    # 桶 capacity 覆盖（MinIO 无 quota 时）；与 ops/categraf-minio 对齐
    bucket-capacity-bytes:
      iceberg-ods: 8796093022208
      iceberg-dwd: 8796093022208
      iceberg-dws: 4398046511104
      archive: 4398046511104
      clickhouse-hot: 2199023255552
    layer-bucket-map:
      ODS: iceberg-ods
      DWD: iceberg-dwd
      DWS: iceberg-dws
      ADS: iceberg-dws
      DIM: iceberg-dws
    profile-daily-enabled: false
    profile-table-timeout-ms: 60000
    profile-max-tables: 200
  # 合规删除：HMAC key + sa_compliance 进 Vault；yml 明文仅 bootstrap，导入后可清空
  compliance:
    hmac-vault-path: platform/compliance/subject-hmac
    subject-hmac-key: 
    sa-vault-path: platform/compliance/sa_compliance
    # 空则 bootstrap 复用 clickhouse.user/password；生产改为独立账号
    sa-user: ""
    sa-password: ""
    sa-gravitino-user: sa_compliance
