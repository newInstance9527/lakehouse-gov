#########################################
# server configuration
#########################################
server.port=8080
server.servlet.context-path=/lakehouse
spring.application.name=snowy
#########################################
# logging configuration
#########################################
logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss.SSS
# 日志目录：app-log/log_error.log、log_debug.log、log_total.log
log.path=app-log
logging.level.root=INFO
logging.level.vip.xiaonuo=INFO
logging.level.vip.xiaonuo.lh=DEBUG
# 联调可选：打开 SQL（需要时取消注释）
# logging.level.com.baomidou.mybatisplus=DEBUG
# mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
#########################################
# spring allow-circular-references
#########################################
spring.main.allow-circular-references=true
#########################################
# spring profiles configuration
#########################################
spring.profiles.active=local
#spring.profiles.active=test
#spring.profiles.active=prod
#########################################
# multipart configuration
#########################################
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.max-file-size=100MB
#########################################
