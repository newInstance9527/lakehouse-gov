# Milvus standalone · 知识库向量（D2）
# 用法：cp .env.example .env && docker compose up -d
# 门户：lh.ai.milvus-enabled=true · lh.ai.milvus-uri=http://<host>:19530
# 未启用 / 不可达时门户自动降级 MySQL 关键词检索

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: lh-milvus-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - lh_milvus_etcd:/etcd

  minio-milvus:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: lh-milvus-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - lh_milvus_minio:/minio_data

  milvus:
    image: milvusdb/milvus:v2.4.4
    container_name: lh-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio-milvus:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      # gRPC（门户 lh.ai.milvus-uri）
      - "${MILVUS_GRPC_PORT:-19530}:19530"
      # HTTP 健康 / metrics
      - "${MILVUS_HTTP_PORT:-9091}:9091"
    volumes:
      - lh_milvus_data:/var/lib/milvus
    depends_on:
      - etcd
      - minio-milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  lh_milvus_etcd:
  lh_milvus_minio:
  lh_milvus_data:
